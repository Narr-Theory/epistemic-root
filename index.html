<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Epistemic Root of AI-Perceived Product Claim</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #ffffff;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #root-svg {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>
  <object
    id="root-svg"
    type="image/svg+xml"
    data="root.svg"
    aria-label="Epistemic Root of AI-Perceived Product Claim"
  >
    Your browser does not support SVG files.
  </object>

  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>

  <script>
    (function () {
      "use strict";

      var svgObject = document.getElementById("root-svg");
      var panZoomInstance = null;
      var resizeTimer = null;
      var currentMode = null;
      var lastViewportWidth = window.innerWidth;

      /*
       * Center point of the “Target Narrative” box
       * inside the new root.svg.
       */
      var FOCUS_POINT = {
        x: 1495.217,
        y: 206.152
      };

      /*
       * anchorX and anchorY control where the Target Narrative
       * appears within the screen:
       *
       * anchorX: 0 = left, 0.5 = center, 1 = right
       * anchorY: 0 = top, 0.5 = center, 1 = bottom
       */
      var OPENING_VIEWS = {
        desktop: {
          zoom: 3.0,
          anchorX: 0.67,
          anchorY: 0.26
        },

        mobile: {
          zoom: 4.6,
          anchorX: 0.67,
          anchorY: 0.15
        }
      };

      function getLayoutMode() {
        var narrowScreen = window.innerWidth <= 768;

        var coarsePointer =
          window.matchMedia &&
          window.matchMedia("(pointer: coarse)").matches;

        var mobileSizedTouchscreen =
          coarsePointer &&
          Math.min(window.innerWidth, window.innerHeight) <= 900;

        return narrowScreen || mobileSizedTouchscreen
          ? "mobile"
          : "desktop";
      }

      function prepareEmbeddedSvg() {
        try {
          var svgDocument = svgObject.contentDocument;

          if (!svgDocument || !svgDocument.documentElement) {
            return;
          }

          var svgRoot = svgDocument.documentElement;

          svgRoot.style.touchAction = "none";
          svgRoot.style.userSelect = "none";
          svgRoot.style.webkitUserSelect = "none";
        } catch (error) {
          // Interaction will still work if these optional styles cannot be set.
        }
      }

      function createMobileEventsHandler() {
        return {
          haltEventListeners: [
            "touchstart",
            "touchend",
            "touchmove",
            "touchleave",
            "touchcancel"
          ],

          init: function (options) {
            var instance = options.instance;
            var initialScale = 1;
            var previousDeltaX = 0;
            var previousDeltaY = 0;

            this.hammer = new Hammer.Manager(options.svgElement, {
              touchAction: "none"
            });

            var panRecognizer = new Hammer.Pan({
              threshold: 0,
              pointers: 0
            });

            var pinchRecognizer = new Hammer.Pinch({
              threshold: 0,
              enable: true
            });

            pinchRecognizer.recognizeWith(panRecognizer);

            this.hammer.add([
              panRecognizer,
              pinchRecognizer
            ]);

            this.hammer.on("panstart", function () {
              previousDeltaX = 0;
              previousDeltaY = 0;
            });

            this.hammer.on("panmove", function (event) {
              instance.panBy({
                x: event.deltaX - previousDeltaX,
                y: event.deltaY - previousDeltaY
              });

              previousDeltaX = event.deltaX;
              previousDeltaY = event.deltaY;
            });

            this.hammer.on("pinchstart", function () {
              initialScale = instance.getZoom();
            });

            this.hammer.on("pinchmove", function (event) {
              instance.zoomAtPoint(
                initialScale * event.scale,
                {
                  x: event.center.x,
                  y: event.center.y
                }
              );
            });
          },

          destroy: function () {
            if (this.hammer) {
              this.hammer.destroy();
              this.hammer = null;
            }
          }
        };
      }

      function applyOpeningView() {
        if (!panZoomInstance) {
          return;
        }

        currentMode = getLayoutMode();
        lastViewportWidth = window.innerWidth;

        var view = OPENING_VIEWS[currentMode];

        /*
         * Establish the base scale, apply the device-specific
         * zoom, and then position the Target Narrative directly.
         */
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
        panZoomInstance.zoom(view.zoom);

        var sizes = panZoomInstance.getSizes();
        var realZoom = sizes.realZoom;

        panZoomInstance.pan({
          x:
            (sizes.width * view.anchorX) -
            (FOCUS_POINT.x * realZoom),

          y:
            (sizes.height * view.anchorY) -
            (FOCUS_POINT.y * realZoom)
        });
      }

      function initializeRoot() {
        if (
          panZoomInstance ||
          typeof window.svgPanZoom !== "function"
        ) {
          return;
        }

        prepareEmbeddedSvg();

        currentMode = getLayoutMode();
        lastViewportWidth = window.innerWidth;

        var isMobile = currentMode === "mobile";

        var options = {
          panEnabled: true,
          zoomEnabled: true,
          controlIconsEnabled: true,

          dblClickZoomEnabled: !isMobile,
          mouseWheelZoomEnabled: true,
          preventMouseEventsDefault: true,

          zoomScaleSensitivity: isMobile ? 0.25 : 0.20,

          fit: true,
          center: true,
          contain: false,

          minZoom: 0.5,
          maxZoom: 20,
          refreshRate: "auto"
        };

        if (isMobile && window.Hammer) {
          options.customEventsHandler =
            createMobileEventsHandler();
        }

        panZoomInstance = window.svgPanZoom(
          svgObject,
          options
        );

        /*
         * Wait for the embedded SVG and browser viewport
         * to finish calculating their sizes.
         */
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(applyOpeningView);
        });
      }

      function handleViewportResize() {
        window.clearTimeout(resizeTimer);

        resizeTimer = window.setTimeout(function () {
          if (!panZoomInstance) {
            return;
          }

          var newMode = getLayoutMode();
          var newWidth = window.innerWidth;

          var modeChanged =
            newMode !== currentMode;

          var substantialWidthChange =
            Math.abs(newWidth - lastViewportWidth) > 80;

          panZoomInstance.resize();

          if (modeChanged || substantialWidthChange) {
            applyOpeningView();
          }
        }, 160);
      }

      svgObject.addEventListener(
        "load",
        initializeRoot
      );

      /*
       * Covers browsers where the SVG finishes loading
       * before the load listener is registered.
       */
      if (
        svgObject.contentDocument &&
        svgObject.contentDocument.documentElement
      ) {
        initializeRoot();
      }

      window.addEventListener(
        "resize",
        handleViewportResize,
        { passive: true }
      );
    })();
  </script>
</body>
</html>
